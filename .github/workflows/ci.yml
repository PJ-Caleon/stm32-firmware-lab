name: STM32 Firmware CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t stm32-builder .

      - name: Configure and Build Firmware (ARM Cross-Compile)
        run: |
          docker run --rm -v ${{ github.workspace }}:/src stm32-builder cmake -B build-fw -G Ninja \
              -DCMAKE_SYSTEM_NAME=Generic \
              -DCMAKE_C_COMPILER=arm-none-eabi-gcc \
              -DCMAKE_ASM_COMPILER=arm-none-eabi-gcc
          docker run --rm -v ${{ github.workspace }}:/src stm32-builder cmake --build build-fw

      - name: Configure and Run Host Unit Tests (Unity + ASan/UBSan)
        run: |
          docker run --rm -v ${{ github.workspace }}:/src stm32-builder cmake -B build-host -G Ninja
          docker run --rm -v ${{ github.workspace }}:/src stm32-builder cmake --build build-host
          docker run --rm -v ${{ github.workspace }}:/src stm32-builder ctest --test-dir build-host --output-on-failure

      - name: Run Static Analysis (Cppcheck)
        run: |
          docker run --rm -v ${{ github.workspace }}:/src stm32-builder cppcheck \
              --enable=warning,style,performance,portability \
              --error-exitcode=1 \
              --inline-suppr \
              -i src/test/Unity \
              src/
